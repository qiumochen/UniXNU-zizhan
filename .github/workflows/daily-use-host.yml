name: Daily-use host regressions
on:
  push:
    paths:
      - '.github/workflows/daily-use-host.yml'
      - '.github/actions/**'
      - 'board.toml'
      - 'feeds.toml'
      - 'unixnu.lock'
      - 'configs/**'
      - 'dts/**'
      - 'migration/format2/**'
      - 'scripts/**'
      - 'patches/xnu-ipados18/**'
      - 'drivers/ArmCpu/**'
      - 'drivers/ArmDTPlatform/**'
      - 'drivers/PongPower/**'
      - 'userland/**'
      - 'tools/zizhan/mac/check-daily-use-host.py'
      - 'tools/zizhan/mac/thermal-inventory.py'
      - 'tools/zizhan/mac/power-inventory.py'
      - 'tools/zizhan/mac/userland-policy-audit.py'
      - 'tools/zizhan/mac/wait-android.py'
      - 'tools/zizhan/tests/thermal-*'
      - 'tools/zizhan/tests/tsens-*'
      - 'tools/zizhan/tests/xnu-patch-format.py'
      - 'tools/zizhan/tests/wait-android.py'
      - 'tools/zizhan/tests/bringup-policy.py'
      - 'tools/zizhan/tests/adsp-*'
      - 'tools/zizhan/tests/power-*'
      - 'tools/zizhan/tests/userland-policy-audit.py'
      - 'tools/zizhan/tests/service-policy.py'
      - '!**/*.md'
      - '!**/*.rst'
  pull_request:
    paths:
      - '.github/workflows/daily-use-host.yml'
      - '.github/actions/**'
      - 'board.toml'
      - 'feeds.toml'
      - 'unixnu.lock'
      - 'configs/**'
      - 'dts/**'
      - 'migration/format2/**'
      - 'scripts/**'
      - 'patches/xnu-ipados18/**'
      - 'drivers/ArmCpu/**'
      - 'drivers/ArmDTPlatform/**'
      - 'drivers/PongPower/**'
      - 'userland/**'
      - 'tools/zizhan/mac/check-daily-use-host.py'
      - 'tools/zizhan/mac/thermal-inventory.py'
      - 'tools/zizhan/mac/power-inventory.py'
      - 'tools/zizhan/mac/userland-policy-audit.py'
      - 'tools/zizhan/mac/wait-android.py'
      - 'tools/zizhan/tests/thermal-*'
      - 'tools/zizhan/tests/tsens-*'
      - 'tools/zizhan/tests/xnu-patch-format.py'
      - 'tools/zizhan/tests/wait-android.py'
      - 'tools/zizhan/tests/bringup-policy.py'
      - 'tools/zizhan/tests/adsp-*'
      - 'tools/zizhan/tests/power-*'
      - 'tools/zizhan/tests/userland-policy-audit.py'
      - 'tools/zizhan/tests/service-policy.py'
      - '!**/*.md'
      - '!**/*.rst'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay thermal inputs and userland policy drift
        run: python3 tools/zizhan/mac/check-daily-use-host.py
