name: Display host regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay display command ownership
        run: python3 tools/zizhan/mac/check-display-host.py --cc clang
