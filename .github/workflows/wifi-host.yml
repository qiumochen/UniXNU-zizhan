name: Wi-Fi host regressions

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/Ath12kWifi
          ref: f6bf561f92cc42761bdd417fce1d53fe1db9477c
          path: shared
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay SMMU, WMI, DHCP and USB failure paths
        run: |
          set -euo pipefail
          python3 tools/zizhan/mac/check-wifi-host.py --cc clang --shared shared
