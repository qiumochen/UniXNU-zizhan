  {kind = "source", reference = "docs/progress/2026-11-23-round6.md", result = "2026-11-23: PongWifi flags its firmware start for the Bluetooth probe; no Wi-Fi behaviour change (slpi-11..15 stay associated)."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "Wi-Fi stays connected with the MSI-gated interrupt dispatch and ASPM L1: wifi-mhi-3 ping 338/340, RTT median 73.5 ms across display cycles."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "Wi-Fi stays associated with 802.11 power save while the display is off (default zizhan_wifi_ps=2): wifi-ps-2 ping 345/347 without a gap, RTT median 96 ms across display cycles."},
  {kind = "host", command = "python3 tools/zizhan/mac/check-daily-use-host.py (gcc:14 + clang Linux container and macOS); DEFCONFIG=pong_ipados18_ci_defconfig bash ci_kernel.sh; DEFCONFIG=zizhan_ipados18_gpu_defconfig bash ci_kernel.sh", revision = "20b7b01487942d3f2eabb0c45760acce440f3a53", reference = "docs/progress/STATUS.md", result = "GCC -Werror compatibility for the new audio/SLPI/RPMh/IPCC host regressions: braces added only where GCC flagged misleading indentation, enum casts and a scoped -Waddress pragma in harnesses. Daily-use host passes under Linux GCC and macOS; reduced/full kernels, display and Wi-Fi host pass. No runtime behaviour change and no device result."},
