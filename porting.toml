  {kind = "device", command = "temporary boot PRM41 dry: play-d x2, play2-d x4 (2 in flight), play3-d x2, play4-d x3 (3 in flight, 40 ms behind the producer, 5176e5e3)", revision = "2b82fd3f13a4aed4f35d02d3d7cc53e47a57a1dc", reference = "docs/progress/2026-11-18-audio-service-device.md", result = "PASS silent dual-amp window (zizhan_pulse_dry=1, no AMP or volume write): both CS35L41 prepared to HALO running together, armed, held ~1.0 s while the continuous flow streamed 99-103 periods, 19-20 fault/HALO polls clean, disarmed, pdn, both torn down, data pin restored, reset asserted, PRM PASS. Final arm: peak_inflight 3, starved 0. Bring-up to window ~33 s (amp RAM load). Attended (AMP on) not yet run."},
  {kind = "source", reference = "docs/progress/2026-11-15-slpi-shared-resources.md", result = "QcomQmp.c (inherited from Pong) used a fall-through comment with a colon, which GCC -Wimplicit-fallthrough=3 does not accept; the new slpi-shared-resources host test is the first to compile it with GCC -Werror (Daily-use CI run 44071583226). Comment-only change to the accepted dash form; no code change."},
  {kind = "host", command = "DEFCONFIG=pong_ipados18_ci_defconfig bash ci_kernel.sh; DEFCONFIG=zizhan_ipados18_gpu_defconfig bash ci_kernel.sh; python3 tools/zizhan/mac/check-daily-use-host.py; python3 tools/zizhan/mac/check-display-host.py", revision = "0f85bb980665acbeefb18afc231c4fce1e6ff273", reference = "docs/progress/2026-11-17-status-archive.md", result = "Branch wip/2026-11-17-audio-sensors (11-15..11-17 work committed 2026-11-17): PongPower gains default-off SE15/CS35L41, AudioReach PRM/graph/DMA/ring (zizhan_audio_prm modes up to 38), cmd-db capture and RPMh batch/receipt owners; pong_power_start_optional calls the new probes, each a no-op without its boot-arg. Reduced and full kernels build, daily-use host 83 PASS lines and display host pass on the committed tree. Device results stay in the per-mode dated records; no speaker output, SLPI start or new default behaviour."},
