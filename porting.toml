  {kind = "source", reference = "docs/progress/2026-11-23-round6.md", result = "2026-11-23: no power change."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "POWER-05: ZizhanStandbyRpmh (default off) dumps APSS DRV2 TCS and lowers cx/mx or bus votes while the display is off. Battery-only stby-ab2: bus votes lowered ~-566 mA vs ~-600 mA unchanged (5%); cx/mx 448->256 no measurable change; standby ~2.2 W needs real system sleep."},
