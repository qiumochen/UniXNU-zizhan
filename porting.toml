  {kind = "source", reference = "docs/progress/2026-11-06-overnight.md", result = "Original normal-image hold resumes after file-level verification disproved the viewer-based graphics alarm. A default-off native periodic HTTPS witness is host-tested and compiled/signed for a helper-only trial; post-baseline failure stops that probe without changing network configuration. Prepared, installed and device-qualified states remain separate. Natural T1, distinct SSID/subnet and end-of-window HTTPS remain independent qualifications."},
