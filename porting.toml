  {kind = "source", reference = "docs/progress/2026-11-23-round5.md", result = "2026-11-23: no GPU change."},
  {kind = "source", reference = "docs/progress/2026-11-21-round4.md", result = "2026-11-21: Adreno per-client GPU VA windows; WebKit's GPU process now prefers the 256 MiB windows (slots 4-7) and every client logs slot/window/peak. user-ipad-1 showed OutOfMemory(Device) texture refusals and a black baidu.com; gpu-web-1 rendered baidu.com with no refusal."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "POWER-07: pong_gpu_dcvs_wake_mhz (default 0 = unchanged doubling) fixes the DCVS wake boost clock; 578 MHz saved 31 mA display-on idle (-909 -> -878 mA) but one open/home round moved the hitch median 42 -> 50 ms, so the default is kept."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "No GPU change in this range."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "UX-03: the GPU BO pool defaults to 768 MiB (cap 1024, halving fallback kept). A full 256 MiB pool sent BOs to scattered spans with 40-77 ms BoAlloc/BoFree inside animations; pool-512 cut the 1 s max frame gap p90 from 283 to 67 ms, pool-1024 peaked at 684 MiB with no fallback; daily-18 on 768 passed."},
