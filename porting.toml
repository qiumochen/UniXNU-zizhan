  {kind = "device", command = "temporary boot stk-a x2 (default) and stk-r x2 (PRM34 dry + write probe), kernel 762da722", revision = "3090f6e77b66cc52071cc520c9fd09697cb19350", reference = "docs/research/2026-11-18-kernel-stack-audit.md", result = "Stack hardening from the 11-18 audit: GPU mailbox poller 3696 -> 112 B, UFS transportFailure 3328 -> 928 B, GT poller 2464 -> 432 B, CS35L41 trim 336 B (buffers static, single thread or serialized). Four silent rounds boot to the desktop and return to Android; PRM34 dry PASS with 4/4 WRITE done; no panic. All cs35l41 host tests pass on clang and gcc:14."},
  {kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "Root layout, root-mount deadlock analysis and before/after 0006 results."},
]

[[area]]
id = "display"
status = "implemented"
components = ["PongPlatform24"]
paths = ["configs/pong-display-sm8475.json", "configs/zizhan-display-sm8475.json", "drivers/PongPower/PongDsiLease.h", "drivers/PongPower/PongBacklight*", "drivers/PongAdreno/PongAdrenoScanout.cpp", "scripts/*display*", "patches/xnu-ipados18/0009-*", "patches/xnu-ipados18/0011-*", "patches/xnu-ipados18/0012-*", "patches/xnu-ipados18/0013-*", "patches/xnu-ipados18/0015-*", "patches/xnu-ipados18/0021-*"]
inputs = ["Inner DSI-1 panel: 2160x1916, command mode, DSC, 60/120 Hz.", "Bootloader cont_splash_region: 0xb8000000+0x2b00000."]
configuration = ["ADT display-scale=2 and artwork-scale-factor=2 (1080x958 points).", "pong_panel_hz=120 by default.", "Kernel defaults: pong_dpu_flip=1, pong_dpu_bufs=2, pong_zc=2, fb_swapwait=1."]
procedure = ["Send timing@1 timing-switch commands through the DSI command FIFO to select 120 Hz.", "Flip DPU directly to CoreAnimation surfaces using triple buffering and no scanout GPU copy.", "Keep outer-panel and fold/display routing disabled until separate DSI1 ownership, panel initialization and observed fold-state transition are implemented."]
findings = ["At scale 3, 1916/3 is fractional and SpringBoard status-bar Auto Layout recurses until crash; scale 2 reaches Home Screen (u3).", "INTF_1 counters changed from 60.5/s to 120.2/s and latch ceiling from 16.6 to 8.3 ms. The early synthetic workload improved from 44.6 to 54-55 fps; later display-link measurements are in gpu.", "Removing the 2.5 ms per-frame scanout copy presented every submitted frame without counted tears.", "Pre-create and retain cached mappings for actual reserved panel slots, then lease bounded subdescriptors to canvases; failed reservations are not offered. DSI timing and asynchronous brightness share an owner lease. Real read/write/readback and native Settings slider targets 512/1331/1024 passed; no photometry is invented.", "POWER-02's immediate deliverable is the native request-to-inner-panel-off/wake-to-visible-first-frame slice; CPU deep idle and unrelated device runtime PM are later increments. MiniIOMobileFramebuffer RequestPowerChange still has no hardware transaction. The public IOGraphics power enum is Off=0, MinUsable=1, On=2; one prior device observation saw only scalar=1, so the off/on request and completion ABI remain unqualified.", "A bounded DSI command DMA path now consumes one dedicated DarwinBoot24 low-address page, requires a fresh fixed display group/context snapshot with identity mode before each long packet, and restores controller registers only after DMA completion and idle. Host replay and builds pass; no long packet or panel transition has run on device.", "Android only: synchronized sensor history recorded two full hinge cycles from 178 degrees to 4/5 degrees with fold_state 0->1, then reopened to 174-178 with fold_state 1->0. Separate Android display snapshots retained inner ON/outer OFF, not correlated to transitions. This does not qualify iPadOS outer display or switching."]
completion = ["Display iPadOS Home Screen on the inner panel with stable presentation at 120 Hz."]
limits = ["Outer display is unsupported. Inner brightness uses real DCS readback and the native Settings chain; panel photometric calibration and automatic ambient sensing are not provided.", "Old screenshot log lines were truncated to about 39/135 sampled columns. The segmented format was device-verified in g248/g249; sampled screenshots do not replace pixel-level panel inspection."]
next_action = ["Do not repeat memory-v2 unchanged: its normal-display device boot returned to fastboot after about 59 seconds and produced an empty fresh XNU console (0 screenshots); the supervisor's transport return is not feature PASS. First localize the pre-console boot failure using the retained candidate, loader, ADT and short ramoops evidence; fix the smallest source/packaging issue and rebuild. Once ordinary boot is restored, verify the reserved command-page handoff and identity-gated mapping on device. Then connect the observed native Off/On request ABI to a serialized bounded panel transaction, drain real producers, and verify a visible first frame. Do not claim the MVP until an attended device off/wake round returns without reboot. CPU/SoC sleep and network wake remain later POWER-02 stages."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-24-zoom-cadence-and-sandbox.md", result = "2026-11-24: PongAdrenoScanout zcFlip polls a fixed per-swap compositor fence target instead of chasing gGtRing lastSubmitted inside the poll loop (pong_zc_fence_mode=2), and dbInit defaults pong_dpu_bufs to 1 under pong_zc>=2 so the 128 MiB loader pool holds 1 copy buffer (+ db[0]) and 6 zero-copy canvas slots. Shipping defaults (uxz-5, play160) cut open_zoom >33 ms frames from 21-23% to 5% (58.6 fps), exit_zoom >33 ms from 21-25% to 11% (54.3 fps), and canvas slot NONE FREE misses from 8-11 to 0; pong_zc_async=1 (uxz-4) regressed >25 ms to 31-33% from VSYNC phase drift and stays 0."},
  {kind = "source", reference = "docs/progress/2026-11-23-round6.md", result = "2026-11-23: no display change."},
  {kind = "source", reference = "docs/progress/2026-11-19-power-s3-device.md", result = "S3 inner-panel off/on executor (zizhan_display_power=1, default off): unattended 10 off/on rounds x3 PASS, later daily-9 on build-play45 20/20 PASS; simulated lid (zizhan_hall_simulate) turned the inner panel off with TE GPIO86 0 edges and back on with 44 edges per 100 ms. Real Hall fold and human screen check still pending."},
