[[area]]
id = "gpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/PongAdreno/**", "drivers/PongMetal/**", "patches/mesa/**", "patches/metal2vulkan/**", "scripts/*metal*", "scripts/*adreno*", "scripts/*turnip*", "userland/ui_compat18.c"]
