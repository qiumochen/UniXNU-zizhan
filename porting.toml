schema_version = 1

[device]
name = "zizhan"
soc = "SM8475"
os_profile = "ipados-18.7.10-22H374"
summary = "Xiaomi MIX Fold 2: iPadOS 18.7.10 (iPad7,12 runtime identity) inner 120 Hz zero-copy display, L18 DCS brightness, touch/keyboard, Adreno 730 rendering, default Wi-Fi (WPA2/DHCP/HTTPS and 2.4/5 GHz reconnect), Bluetooth BLE scan, battery gauge and daily TSENS thermal/screen-off power controls. Opt-in SLPI sensors drive 180-degree rotation; attended speaker audio, outer-panel UI/touch, standalone boot and SoC sleep remain open."

[[area]]
id = "configuration"
status = "host-verified"
components = ["PongPlatform24"]
paths = ["board.toml", "proprietary-files.txt", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", "migration/format2/**", "scripts/*format2*", "scripts/build-pong-profile-kernel.py"]
inputs = ["zizhan (22061218C) live /sys/firmware/fdt; MIUI V14.0.15.0.TLRCNXM, Android 13, kernel 5.10.136.", "SM8475 shared support and PongPlatform24 from UniXNU-pong (Nothing Phone (2)).", "iPad7,11 iPadOS 18.7.10 / 22H374 restore."]
configuration = ["board.toml: name=zizhan; device_tree.source=device:dts/zizhan.dts; kernel.defconfig=zizhan_ipados18_gpu_defconfig.", "Default GPU config: CONFIG_XNU_PONG_ADRENO_PLATFORM=y, CONFIG_XNU_PONG_POWER=y, CONFIG_XNU_PONG_WIFI=y, CONFIG_XNU_PONG_BACKLIGHT=y.", "Apply patches/xnu-ipados18/series in order: 0001-0006 and 0008-0021."]
procedure = ["Generate dts/zizhan.dts from the live DT with tools/gen_reserved.py, replacing model, compatible, DRAM and reserved-memory in the Pong layout.", "Select uefi-zizhan Platforms/Xiaomi/zizhanPkg/zizhan.dsc; retain ARM64, SM8475, 22H374 and board layers."]
findings = ["The second DRAM bank is 0xf4600000+0xba00000, versus Pong 0xf1400000+0xec00000. ADSP uses 0x9fd00000+0x3100000, versus Pong 0x85700000+0x2800000. SMEM, IPCC, AOSS and cmd-db addresses agree.", "The Pong build scripts do not depend on the board name.", "The device default now enables GPU and Wi-Fi together. The old Wi-Fi defconfig is a relative symlink to the canonical GPU defconfig; local default build/packaging no longer needs separate profile or radio-enable options. The board-specific Wi-Fi hardware inputs remain in zizhan-wifi-sm8475.json.", "One canonical device defconfig enables GPU and Wi-Fi; the previous Wi-Fi name is a compatibility symlink. Default and explicit reduced CI kernels built successfully.", "The canonical device profile now also enables verified L18 backlight. A board-specific version-2 ADT uses the live primary-panel maximum 2047, minimum nonzero 4, DSI0 and VC0; mismatched Pong panel parameters are rejected.", "THERM-01 adds a zizhan-only TSENS/EPSS input JSON from live Android FDT; it contains no adopted thermal policy. The 11-07 default-off observer now gets reviewed physical resources through an ADT contract. A separate explicit 22H374 service-presence control can stage the installed OS370 fairplayd selection without changing default exclusions.", "The publication records the zizhan-only fixed display-domain board resource and its guarded ADT encoding; foreign or changed apertures are rejected. Host resource/transport replays and both kernel configurations passed; no new display power qualification is claimed."]
completion = ["Compile the board DTS, kernel and boot image, then reach the iPadOS Home Screen on the phone."]
limits = ["Outer display and audio remain disabled. Default GPU/Wi-Fi integration does not qualify untested long-duration or broader network cases; see the network limits."]
next_action = ["Keep build and device evidence separate and reproduce the published configuration before changing board inputs."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-09-publication.md", result = "Publication ownership reconciliation for the cumulative 11-08/09 configuration change; host and device evidence remain separated, with runtime limits retained."},
  {kind = "source", reference = "docs/progress/2026-11-06-daily-use-development.md", result = "Live board inputs and isolated service-policy catalogs; no new kernel configuration or default runtime capability."},
  {kind = "host", command = "ci_kernel.sh default/reduced; inspect compiled settings and ADT; UI/helper compile/sign", revision = "88e5106dca99c03b9be1af02ceae5b041480a83d", reference = "docs/evidence/2026-11-05-display-and-backlight.txt", result = "The default enables GPU, Wi-Fi and verified primary L18 brightness with board-owned limits. Reduced CI still builds without GPU-only references."},
  {kind = "device", command = "cycle.sh out/g344-default-combined/pong-xnu-initial.img g344-default-combined 480", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "Combined device defaults without DEFCONFIG/PROFILE/WIFI overrides passed native automatic association, keys, DHCP and HTTPS 200. Zero link loss or canvas-mapping errors; three complete Settings screenshots, deadline return and fresh UFS log."},
  {kind = "host", command = "ci_kernel.sh default and explicit CI; ci_boot_ufs.sh default/WIFI=0/explicit CI; check-wifi-host.py", revision = "cc016a5c44c1ed074e98ea7c1104c1e5cbdff88f", reference = "docs/evidence/2026-11-05-default-gpu-wifi.txt", result = "One canonical device defconfig enables GPU and Wi-Fi; the previous Wi-Fi name is a compatibility symlink. Default and explicit reduced CI kernels built successfully."},
  {kind = "source", reference = "docs/progress/2026-10-28-device-prep.md", result = "Live hardware, partition backup and stock UEFI memory-map comparison."},
  {kind = "source", reference = "docs/progress/2026-11-01-battery.md", result = "Board-specific addresses and differences from Pong."},
  {kind = "host", command = "GitHub Actions zizhan macOS build (macos-15-intel, Xcode 16.4, pong_ipados18_ci_defconfig)", revision = "28d9f4fe869293e7a384b18b800ceb8dd56c1244", reference = "https://github.com/qiumochen/UniXNU-zizhan/actions/runs/41304992346", result = "Hosted macos-15-intel runner resolved four layers, compiled the DTS, applied 13 XNU patches and linked the CI kernel; pong-macos-products uploaded."},
]

[[area]]
id = "firmware"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/DarwinBoot24/**", "scripts/build-darwinboot24*"]
inputs = ["uefi-zizhan: uefi-pong plus Platforms/Xiaomi/zizhanPkg.", "Stock uefi_b uefiplat.cfg memory map."]
configuration = ["PIL Reserved size=0x1DC00000; remove Demura and QTEE.", "SimpleFbDxe: framebuffer=0xb8000000, 2160x1916, inherited cont_splash_region.", "Temporary fastboot boot only; do not flash partitions."]
procedure = ["build_fw.sh builds the zizhanPkg FD with EDK II; build_bootimg.py combines BootShim, FD and the device DTB into boot v4.", "DarwinBoot24 reads the UniXNU menu and arms pong_autoreset before XNU handoff.", "ci_boot_ufs.sh rejects command lines above its 1020-byte limit; DarwinBoot24 requires fewer than 1024 bytes."]
findings = ["The inner panel shows the Silicium logo and UniXNU menu with correct color and orientation; DarwinBoot24 hands off to XNU.", "On refusal, DarwinBoot24 appends the reason to logfs:\\BOOTFAIL.TXT, retries, then returns to fastboot.", "A Wi-Fi kernel with larger embedded firmware occupied the temporary low-memory ReadFile buffer while the loader requested scanout pages. Free copied kernel/ADT inputs before reserving the optional 96 MiB pool. g299/g300 used the same kernel with radio disabled; the changed loader restored the real pool and complete screenshots.", "The zizhan DarwinBoot24 panel pool reservation is 128 MiB below 4 GiB, leaving five canvas slots with the default two display buffers. v6 and subsequent ordinary-display trials exercised this loader; this does not qualify DSI power-off or sleep."]
completion = ["Temporary boot reaches the menu and XNU; failures retain an automatic return path."]
limits = ["Qualcomm DXE binaries still come from uefi-pong Binaries/pong. There is no zizhan DisplayDxe and the outer panel stays off."]
next_action = ["Audit the stock FV Panel_L18_38_0c_0a_sec_dsc_cmd.xml before attempting outer-panel support."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-23-round5.md", result = "2026-11-23: DarwinBoot24 (UEFI loader) switches the Gunyah watchdog off at hand-off when pong_autoreset is not set; otherwise unchanged."},
  {kind = "source", reference = "docs/progress/2026-11-08-panelpool-128.md", result = "Publication ownership reconciliation for the cumulative 11-08/09 firmware change; host and device evidence remain separated, with runtime limits retained."},
  {kind = "device", command = "cycle.sh g299-wifi-kernel-radio-off; cycle.sh g300-loader-radio-off", revision = "03363797d9ffb10fd35ad5823331e89b4bb3c624", reference = "docs/evidence/2026-11-04-wifi-settings-and-roaming.txt", result = "Loader-only comparison changed no-pool fallback into a real 96 MiB zero-copy pool and full sampled screenshot."},
  {kind = "source", reference = "docs/progress/2026-10-29-xnu-bringup.md", result = "Device record of UEFI, DarwinBoot24 handoff and early XNU boot."},
]

[[area]]
id = "cpu"
status = "implemented"
components = ["PongPlatform24"]
paths = ["drivers/ArmCpu/**", "drivers/ArmDTPlatform/**", "scripts/build-pong-armcpu*", "scripts/build-pong-platform*", "patches/xnu-ipados18/0003-*", "patches/xnu-ipados18/0005-*", "patches/xnu-ipados18/0008-*", "patches/xnu-ipados18/0014-*", "configs/zizhan-thermal-sm8475.json", "scripts/zizhan_tsens_inputs.py"]
inputs = ["SM8475: four Cortex-A510, three Cortex-A710, one Cortex-X2; GICv3, 19.2 MHz timer and PSCI."]
configuration = ["ADT cluster-type is required with PONG_ADT_CLUSTERS=1; build two clusters with __ARM_AMP__.", "pong_fast_pri=47 and pong_fast_cpu=7 by default.", "ml-timeout-lock-panic-scale=40; interrupt-masked-debug-mode=1."]
procedure = ["0008 exposes E/P clusters to AMP, 0014 prefers an idle X2 for UI-priority threads, and 0003 bounds qsort recursion to avoid early stack overflow."]
findings = ["All eight CPUs start. An AMP kernel without ADT cluster-type stalls early (g97).", "Under Gunyah, ordinary pauses can exceed the DEVELOPMENT 500 us interrupt-masking threshold. Following sheng, scale timeouts by 40 and log masking violations; preserve genuine fatal panic handling.", "In g170, a stalled app-opening workload used 0.73 CPU on A710 and 0.09 on X2 for the SpringBoard main thread; 0014 gives UI work X2 preference.", "Read-only Android inventory found 81 thermal zones, 62 cooling devices and three CPU frequency policies; four temperature reads failed and remain explicit errors. Live FDT identifies two TSENS-v2 providers and confirms the current three EPSS/PDMEM domain addresses. These are input observations, not XNU thermal control.", "THERM-01 default-off one-shot TSENS-v2 observation is qualified in g396: two 2.8 banks, 32 unique VALID last-temperature words, independently checked signed deciC decoding and 35.5-46.9 C range. g395 temperature SKIP is retained; its extra TRDY gate was removed according to the actual v2 getter. This proves a bounded register observation, not update freshness, calibration, continuous monitoring or thermal control.", "POWER-02 source review found that ArmCpu halt directly affects the executing CPU, while the native XNU sleep coordinator calls halt on CPU objects; correct target-CPU shutdown/idle continuation and boot-CPU resume are prerequisites. Live DT has rail-pc and shared l3-off/llcc-off states with local-timer-stop; declared parameters and Android cumulative idle counts are inputs, not XNU suspend qualification. Scheduling, EPSS and physical PSCI-domain topologies must remain distinct."]
completion = ["Start eight cores and place UI threads on X2 when available."]
limits = ["No thermal control. Repeated trials heat the phone and can corrupt DRAM ramoops logs."]
next_action = ["Design bounded multi-time sampling, update/age/error semantics and cross-system sensor mapping checks before any continuous temperature service or policy. Vendor normal/map policies are not readable as plaintext in this audit; do not adopt DT high-temperature trips or Android scaling maxima as the XNU thermal policy."]
evidence = [
  {kind = "source", reference = "docs/progress/2026-11-23-round6.md", result = "2026-11-23: frequency caps are this phone's 2016000/2745600/2995200 kHz (Android's top normal rows) instead of the Nothing Phone (2)'s; XNU patch 0037 pong_fast_move (misfit migration to the X2) measured without gain on the app-open stall (183 vs 166 ms median, ux-m1/m2) and left off."},
  {kind = "source", reference = "docs/progress/2026-11-23-round5.md", result = "2026-11-23: no CPU change."},
  {kind = "source", reference = "docs/progress/2026-11-21-round4.md", result = "2026-11-21: init boot-arg pong_tz=<Area/City> links /var/db/timezone/localtime (factory zone was America/Los_Angeles); tz-2 status bar 23:50 Beijing time, init log confirms the change."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "POWER-03/04: pong_cpu_load_log=1 shows idle load 2-5% of 8 cores at the lowest clock rows; ZizhanCpuOffline (daily default) takes CPU 2..7 offline through processor_exit_from_user while the display is off (power-6/7, daily-16: every transition ok, no panic)."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "UART bridge answers Broadcom vendor commands (OGF 0x3f) locally instead of forwarding them to the QCA6490; unexercised so far because BlueTool never opens the device (bt-9..11)."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "No CPU change; see the evening record for the UX-01 A/B (fb_swapwait=0 and permanent boost rejected)."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "Reduced CI kernel (pong_ipados18_ci_defconfig) failed to link: the zizhan services referenced display/backlight/GENI I2C symbols weakly, but the static kernel link has no undefined weak symbols. ArmDTPlatform.cpp now defines stand-ins when Adreno or PongPower are not built, and the outer touch inventory logs SKIP there. Both the CI and GPU (build-play50) kernels link."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "Daily profile (ZizhanDailyProfile.h) turns thermal mode 2 (CPU 90 / GPU 85 C), display power, power-request observer, Hall follow and outer fold on when their boot args are absent; zizhan_daily=0 restores all-off. daily-11 on build-play48 with no daily args: 20/20 S3 PASS, thermal mode 2 and Hall follow running."},
  {kind = "device", command = "temporary boot therm-t1/t2/t3 (f79fda1c): zizhan_thermal=1; =1 + load=60; =2 + test_cpu=60 + load=60", revision = "5c82e53be8b12c6c011ac3b09cacc38f435fa864", reference = "docs/progress/2026-11-18-m2-device-evidence.md", result = "Default-off THERM-01: 1 s two-bank TSENS sampling (idle CPU ~51 C, boot peak 88.4 C), mode 2 caps all EPSS domains at level 20 on a hot sample (1804/2457/2707 -> 300/633/787 MHz) and releases one level per 3 s below the release threshold; the bounded load stops at 75 C (it stopped at once on boot heat). Default thresholds 110/95 C under a real load not yet exercised. Silent, Android return, no panic."},
  {kind = "device", command = "temporary boot power-p1 x2 (52140311): zizhan_power_observe=1 zizhan_power_inject=1", revision = "4b3ca087095cff95a6c58e3058d5a4235549ad82", reference = "docs/progress/2026-11-18-m2-device-evidence.md", result = "POWER-02 S1 observation: two injected 120 ms power presses; backboardd calls selector 12 with one scalar, in0=1 at boot, 0 after the first press, 1 after the second (same in both rounds). Still observe-only, no display transition."},
  {kind = "source", reference = "docs/progress/2026-11-15-hall-observer.md", result = "ArmDTPlatform::configure now also calls the default-off zizhan_hall::start (GPIO62 observer owned by location-sensors) next to the TSENS probe; with zizhan_hall_observe absent it returns without reads. No CPU, cluster, scheduling or thermal behaviour change."},
  {kind = "source", reference = "docs/progress/2026-11-07-power-unattended.md", result = "POWER-02 candidate corrects the Darwin24 remote haltCPU/local quiesceCPU contract. Host builds and normal ADSP trial do not qualify CPU suspend, context restore or target-state wake."},
  {kind = "source", reference = "docs/plan/2026-11-07-lockscreen-suspend-design.md", result = "POWER-02 complete design and read-only audit only; runtime code, kernel/image, OS installation and sleep qualification unchanged."},
  {kind = "source", reference = "docs/evidence/2026-11-07-tsens-readonly.txt", result = "Sanitized two-bank version/control and 32 raw VALID words with decoded temperatures, source dirty-snapshot and actual kernel/image identity. One-shot read-only scope; no freshness or thermal-policy claim."},
  {kind = "source", reference = "docs/progress/2026-11-07-tsens-readonly.md", result = "Uncommitted candidate: full/reduced builds and 34 host cases PASS; g395 temperature SKIP, g396 32 VALID observations PASS. Original supervisor FAIL remains preserved; Android completion was independently witnessed 46.224 seconds later within a 120-second window."},
  {kind = "source", reference = "docs/progress/2026-11-06-daily-use-development.md", result = "Android-only bounded read-only inventory, explicit error handling, reproducible board-input generation and host replay. No new XNU MMIO or thermal-policy qualification."},
  {kind = "source", reference = "docs/progress/2026-10-30-root-and-autoloop.md", result = "Eight-core boot (k4), E/P scheduling comparison and tsample thread records."},
  {kind = "source", reference = "docs/progress/2026-11-01-120hz-and-cadence.md", result = "X2 preference and cadence measurements."},
]

