  {kind = "source", reference = "docs/progress/2026-11-23-round5.md", result = "2026-11-23: boot images can carry boot-args beyond 1024 bytes as /chosen zizhan-boot-args (make-pong-adt --chosen-blob)."},
  {kind = "source", reference = "docs/progress/2026-11-23-round5.md", result = "2026-11-23: no packaging change."},
