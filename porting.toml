  {kind = "source", reference = "docs/progress/2026-11-07-power-unattended.md", result = "POWER-02 owner-control trial retained one 64MiB WLAN DMA allocation failure. Same frozen kernel with owner disabled and the FIFO timing trial subsequently allocated the arena and reached firmware/station/scan milestones; one-sample controls do not establish causality or network long-term qualification."},
