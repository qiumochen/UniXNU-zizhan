  {kind = "source", reference = "docs/progress/2026-11-06-overnight.md", result = "A genuine g384 CS4K storage allocation of 1949696 bytes returned KERN_NO_SPACE before initproc and preserved a panic klog; the identical image later booted. This is not attributed to total physical RAM exhaustion and remains an open boot resource limitation. No signature or panic bypass was introduced."},
