  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "XNU patch 0028 enables processor_exit on PONG: ml_cpu_can_exit allows non-boot cores, processor_exit defaults on, and cpu_sleep publishes ARM_CPU_ON_SLEEP_PATH before PE_cpu_machine_quiesce."},
  {kind = "source", reference = "docs/progress/2026-11-20-round3.md", result = "XNU patch 0027 is a BT-01 diagnostic (zizhan_bt_probe>=4, BlueTool only): deduplicated user stacks at blocking BSD calls and mach_msg. bt-15 placed BlueTool's 31 s hang in runCommandForCurrentConfig's NO_FW_FOUND 'No WiFi' loop: the firmware table needs MobileGestalt WifiVendor, which comes from the Broadcom WLAN HAL (AppleOLYHAL vendor-id) this QCA board lacks."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "XNU patch 0023 registers the PF_SYSTEM kernel control com.apple.uart.bluetooth (what iOS 18 BlueTool opens for device -D: H4 over read/write, TIOCGETA/TIOCSETA as socket options); patch 0026 is a diagnostic syscall trace for BlueTool/bluetoothd (zizhan_bt_probe>=4 only). bt-11: neither daemon ever calls socket() or opens a /dev node, so the blocker is above the transport."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "XNU patches 0024 (crash capture for bluetoothd) and 0025 (J171 product-id answered only to bluetoothd/BlueTool with zizhan_bt_probe>=4); opt-in --bt-node now builds a J171-shaped bluetooth node. bluetoothd stays up (bt-4); BlueTool still needs an AppleBluetoothModule service."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "XNU patches 0024 (crash capture for bluetoothd) and 0025 (J171 product-id answered only to bluetoothd/BlueTool with zizhan_bt_probe>=4); opt-in --bt-node now builds a J171-shaped bluetooth node. bluetoothd stays up (bt-4); BlueTool still needs an AppleBluetoothModule service."},
  {kind = "source", reference = "docs/progress/2026-11-19-evening-daily-default.md", result = "XNU patch 0023-zizhan-bt-uart adds bsd/dev/zizhan_bt_uart.c (H4 tty /dev/cu.bluetooth, D_TTY + kqueue); build-play49 links it. Default off: the node exists only after zizhan_bt_probe=4 attaches; not run on device (bluetoothd would power the radio)."},
  {kind = "host", command = "python3 tools/zizhan/tests/thermal-policy.py, power-inject.py, power-query.py, zizhan-audio-plugin.py (macOS clang and gcc:14 container); full daily-use host; DEFCONFIG=zizhan_ipados18_gpu_defconfig bash ci_kernel.sh", revision = "b030c5bc6eaf32ce03f4746eebc7e4bd1eba925e", reference = "docs/progress/2026-11-18-m2-device-evidence.md", result = "compile_zizhan_audio() builds userland/ZizhanAudioPlugIn.c into ZizhanAudio.driver (own bundle id, factory 2E77A7C3-..., ZizhanAudioUserClient) with the same SDK header handling as the Pong bundle. No default image calls it; trial audio-hal-v1 was prepared host-only (7 changed OS chunks, bundle in /pong/audio-hal18) and is not installed. zizhan-audio-plugin.py checks the protocol and an iOS 18 compile."},
